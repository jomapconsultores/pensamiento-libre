services:
  - type: web
    name: agente-map-api
    runtime: python
    plan: free
    region: oregon
    branch: agente-map
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ANTHROPIC_API_KEY
        sync: false        # configurar en el dashboard
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # ── Constructores no-Claude (redactor + financiero) ──
      - key: MISTRAL_API_KEY
        sync: false        # configurar en el dashboard
      - key: CODESTRAL_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: CODESTRAL_MODEL
        value: codestral-latest
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: BUILDER_ROTATION
        value: mistral,codestral,deepseek
      - key: SYSTEM_LANGUAGE
        value: es
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_JWT
        sync: false
      - key: AGENTE_MAP_API_KEY
        generateValue: true   # Render genera un secreto aleatorio en el primer deploy
