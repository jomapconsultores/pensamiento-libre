services:
  - type: web
    name: pensamiento-libre
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # ---------- Supabase ----------
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ---------- Stripe ----------
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_DONATION_PRICE_ID
        sync: false
      - key: STRIPE_MEMBERSHIP_BASIC_PRICE_ID
        sync: false
      - key: STRIPE_MEMBERSHIP_PREMIUM_PRICE_ID
        sync: false
      - key: STRIPE_SERVICE_TALLER_PRICE_ID
        sync: false
      - key: STRIPE_SERVICE_CONSULTA_PRICE_ID
        sync: false

      # ---------- Email ----------
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        value: jomapconsultores@gmail.com

      # ---------- Admin panel ----------
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ---------- General ----------
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
